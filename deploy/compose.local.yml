name: minishop
x-db-env: &id001
  ConnectionStrings__Shop: Host=db;Database=${POSTGRES_DB:-minishop};Username=${POSTGRES_USER:-minishop};Password=${POSTGRES_PASSWORD:?Defina
    POSTGRES_PASSWORD};Timeout=5;Command Timeout=30;GSS Encryption Mode=Disable
x-worker: &id002
  image: minishop-worker:local
  build:
    context: ..
    dockerfile: deploy/Dockerfile
    args:
      PROJECT: Worker
  environment: *id001
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped
  stop_grace_period: 5s
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-minishop}
      POSTGRES_USER: ${POSTGRES_USER:-minishop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    volumes:
    - shop-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 15
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  api:
    image: minishop-api:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        PROJECT: Api
    environment:
      ConnectionStrings__Shop: Host=db;Database=${POSTGRES_DB:-minishop};Username=${POSTGRES_USER:-minishop};Password=${POSTGRES_PASSWORD:?Defina
        POSTGRES_PASSWORD};Timeout=5;Command Timeout=30;GSS Encryption Mode=Disable
      ServiceKey: ${SERVICE_KEY:?Defina SERVICE_KEY}
      AdminKey: ${ADMIN_KEY:?Defina ADMIN_KEY}
    ports:
    - 127.0.0.1:5081:8080
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  worker-1: *id002
  worker-2: *id002
  worker-3: *id002
  web:
    image: minishop-web:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        PROJECT: Web
    environment:
      NO_PROXY: localhost,127.0.0.1,api,db
      no_proxy: localhost,127.0.0.1,api,db
      ApiBaseUrl: http://api:8080
      ServiceKey: ${SERVICE_KEY:?Defina SERVICE_KEY}
      AdminKey: ${ADMIN_KEY:?Defina ADMIN_KEY}
      AdminPassword: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD}
      ASPNETCORE_ENVIRONMENT: Development
    volumes:
    - web-keys:/home/app/.aspnet/DataProtection-Keys
    ports:
    - 127.0.0.1:8080:8080
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  benchmark:
    image: minishop-benchmarks:local
    healthcheck:
      disable: true
    profiles:
    - tools
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        PROJECT: Benchmarks
    environment:
      ConnectionStrings__Shop: Host=db;Database=${POSTGRES_DB:-minishop};Username=${POSTGRES_USER:-minishop};Password=${POSTGRES_PASSWORD:?Defina
        POSTGRES_PASSWORD};Timeout=5;Command Timeout=30;GSS Encryption Mode=Disable
      BENCH_ITERATIONS: ${BENCH_ITERATIONS:-50000}
    volumes:
    - ../results/live:/results
    command:
    - '5000'
    - '3'
    - /results
    depends_on:
      db:
        condition: service_healthy
volumes:
  shop-data: null
  web-keys: null
