name: MiniShop CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: minishop
          POSTGRES_PASSWORD: ci-disposable-password
          POSTGRES_DB: minishop_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U minishop -d minishop_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      MINISHOP_TEST_DB: Host=localhost;Database=minishop_test;Username=minishop;Password=ci-disposable-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build MiniShop.slnx -c Release
      - run: dotnet test MiniShop.slnx -c Release --no-build --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults
